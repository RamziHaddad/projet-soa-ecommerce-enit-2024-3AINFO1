version: '3'

services:
  order-service:
    image: ahmeddhibi/order-service:latest  # Use a basic Node.js image if you don't want to build a custom image
    container_name: payment-service
    ports:
      - 8085:8085
    networks:
      - global-network
    environment:
      # PostgreSQL connection string for the Bun.js app
      DATABASE_URL: postgres://postgres:azerty@bank-service-db_bank-1:5432/db_order
      SERVER_PORT: 8085
      # Keycloak-related environment variables
      KEYCLOAK_REALM: ecommerce-platform
      KEYCLOAK_AUTH_SERVER_URL: http://92.222.24.59:8080/realms/ecommerce-platform
      KEYCLOAK_CLIENT_ID: payment_client
      KEYCLOAK_CLIENT_SECRET: mNAlaxEMRG3u8z8SGcRmXaspEsavO73L
      KEYCLOAK_BEARER_ONLY: true
      KEYCLOAK_PUBLIC_CLIENT: false
      KEYCLOAK_SSL_REQUIRED: external
      KEYCLOAK_AUTHORIZATION_URI: http://92.222.24.59:8080/realms/ecommerce-platform/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://92.222.24.59:8080/realms/ecommerce-platform/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URI: http://92.222.24.59:8080/realms/ecommerce-platform/protocol/openid-connect/userinfo
    command: sh -c "npm install && npm start"  # Use npm to install dependencies and start the app
networks:
  global-network:
    external: true
