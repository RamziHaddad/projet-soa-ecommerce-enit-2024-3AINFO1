name: CI/CD Job for the order service

on:
  push:
    branches: 
      - reviews
    paths:
      - 'reviews/**'
  pull_request:
    branches: 
      - reviews

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./reviews

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0'  # Specify the version of .NET you need

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the app
      run: dotnet build --configuration Release

    - name: Publish the app
      run: dotnet publish --configuration Release --output ./publish

    - name: List published directory contents
      run: ls -al ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: order-service
        path: ./publish

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/reviews-service:latest .

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/reviews-service:latest
