name: CI Job for the payment service

on:
  push:
    branches: 
      - Payment
    paths:
      - 'payment/**'
  pull_request:
    branches: 
      - Payment

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Bun.js
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies with Bun.js
      run: bun install

    - name: Build with Bun.js
      run: bun build ./src/index.js --outdir ./dist

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: payment-service
        path: dist/

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build --file Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/payment-service:latest .

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:latest
  deploy:
    needs: build 

    runs-on: ubuntu-latest 

    steps: 
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Add Server to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.DEPLOYMENT_MACHINE_IP }} >> ~/.ssh/known_hosts

    - name: Create deployment directory structure on VPS
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "mkdir -p ~/soa-ecomm/payment-service"
        
    - name: Check and clean up docker-compose in payment-service folder
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if [ -f ~/soa-ecomm/payment-service/docker-compose.yml ]; then rm ~/soa-ecomm/payment-service/docker-compose.yml; fi"

    - name: Check and stop payment-service container if running
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if docker ps --format '{{.Names}}' | grep -q '^payment-service$'; then docker stop payment-service && docker rm payment-service; fi"

    - name: Check and create global network if not exists
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if ! docker network ls --format '{{.Name}}' | grep -q '^global-network$'; then docker network create global-network; fi"

    - name: Transfer docker-compose to VPS
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" scp docker-compose.yml \
        ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }}:~/soa-ecomm/payment-service/docker-compose.yml

    - name: Check the status of db_bank container
      id: db_check
      run: |
        STATUS=$(sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if docker ps --filter 'name=bank-service-db_bank-1' --filter 'health=healthy' --format '{{.Names}}' | grep -q '^bank-service-db_bank-1$'; then \
          echo 'healthy'; \
        else \
          echo 'unhealthy'; \
        fi")
        echo "db_status=$STATUS" >> $GITHUB_ENV

    - name: Deploy payment-service
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if [ \"${{ env.db_status }}\" = 'healthy' ]; then \
          echo 'Starting only order-service'; \
          cd ~/soa-ecomm/payment-service && docker-compose up -d payment-service; \
        else \
          echo 'Starting all services'; \
          cd ~/soa-ecomm/payment-service && docker-compose up -d; \
        fi"

    - name: Check deployment status
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "cd ~/soa-ecomm/payment-service && docker-compose ps && docker volume ls && docker network ls && echo 'System Resources:' && df -h && free -h"