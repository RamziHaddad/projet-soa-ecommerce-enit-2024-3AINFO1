name: CI/CD Job for the pricing service

on:
  push:
    branches: 
      - pricing
    paths:
      - 'pricing/**'
  pull_request:
    branches: 
      - pricing

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pricing/demo/demo

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build with Maven
      run: ./mvnw package -DskipTests

    - name: List target directory contents
      run: ls -al ./target/
          
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: pricing-service.jar
       # path: /home/runner/work/soa-test/soa-test/bank/target/bank_v2-1.1.0.jar
        path: pricing/demo/demo/target/*.jar

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build  -t ${{ secrets.DOCKER_USERNAME }}/pricing-service:latest .

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/pricing-service:latest

  deploy:
    needs: build 

    runs-on: ubuntu-latest 

    steps: 
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Add Server to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.DEPLOYMENT_MACHINE_IP }} >> ~/.ssh/known_hosts

    - name: Create deployment directory structure on VPS
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "mkdir -p ~/soa-ecomm/pricing-service"
        
    - name: Check and clean up docker-compose in pricing-service folder
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if [ -f ~/soa-ecomm/pricing-service/docker-compose.yml ]; then rm ~/soa-ecomm/pricing-service/docker-compose.yml; fi"

    - name: Check and stop pricing-service container if running
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if docker ps --format '{{.Names}}' | grep -q '^pricing-service$'; then docker stop pricing-service && docker rm pricing-service; fi"

    - name: Check and create global network if not exists
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if ! docker network ls --format '{{.Name}}' | grep -q '^global-network$'; then docker network create global-network; fi"

    - name: Transfer docker-compose to VPS
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" scp docker-compose.yml \
        ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }}:~/soa-ecomm/pricing-service/docker-compose.yml

    - name: Check the status of db_bank container
      id: db_check
      run: |
        STATUS=$(sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if docker ps --filter 'name=bank-service-db_bank-1' --filter 'health=healthy' --format '{{.Names}}' | grep -q '^bank-service-db_bank-1$'; then \
          echo 'healthy'; \
        else \
          echo 'unhealthy'; \
        fi")
        echo "db_status=$STATUS" >> $GITHUB_ENV

    - name: Deploy pricing-service
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if [ \"${{ env.db_status }}\" = 'healthy' ]; then \
          echo 'Starting only pricing-service'; \
          cd ~/soa-ecomm/pricing-service && docker-compose up -d pricing-service; \
        else \
          echo 'Starting all services'; \
          cd ~/soa-ecomm/pricing-service && docker-compose up -d; \
        fi"

    - name: Check deployment status
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "cd ~/soa-ecomm/pricing-service && docker-compose ps && docker volume ls && docker network ls && docker image ls && echo 'System Resources:' && df -h && free -h"