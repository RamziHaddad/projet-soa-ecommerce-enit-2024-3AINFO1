name: CI/CD Job for the bank service

on:
  push:
    branches: 
      - bank
    paths:
      - 'bank/**'
  pull_request:
    branches: 
      - bank

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bank

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build with Maven
      run: ./mvnw package -DskipTests

    - name: List target directory contents
      run: ls -al ./target/quarkus-app
          
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: bank-service.jar
       # path: /home/runner/work/soa-test/soa-test/bank/target/bank_v2-1.1.0.jar
        path: bank/target/quarkus-app/quarkus-run.jar

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build --file src/main/docker/Dockerfile.jvm --tag ${{ secrets.DOCKER_USERNAME }}/bank-service:latest .

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/bank-service:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Add Server to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.DEPLOYMENT_MACHINE_IP }} >> ~/.ssh/known_hosts

    - name: Create deployment directory structure on VPS
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "mkdir -p ~/soa-ecomm/bank-service"
        
    - name: Check and clean up docker-compose in bank-service folder
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if [ -f ~/soa-ecomm/bank-service/docker-compose.yml ]; then rm ~/soa-ecomm/bank-service/docker-compose.yml; fi"

    - name: Check and stop bank-service container if running
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if docker ps --format '{{.Names}}' | grep -q '^bank_service$'; then docker stop bank_service && docker rm bank_service; fi"

    - name: Check and create global network if not exists
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if ! docker network ls --format '{{.Name}}' | grep -q '^global-network$'; then docker network create global-network; fi"

    - name: Transfer docker-compose to VPS
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" scp docker-compose.yml \
        ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }}:~/soa-ecomm/bank-service/docker-compose.yml

    - name: Check the status of db_bank container
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "if docker ps --filter 'name=db_bank' --filter 'health=healthy' --format '{{.Names}}' | grep -q '^db_bank$'; then \
          echo 'db_bank is running and healthy'; \
          export DB_BANK_STATUS='healthy'; \
        else \
          echo 'db_bank is not running or not healthy'; \
          export DB_BANK_STATUS='unhealthy'; \
        fi" > /tmp/db_bank_status.sh

    - name: Load db_bank status
      run: source /tmp/db_bank_status.sh

    - name: Deploy bank-service
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "source /tmp/db_bank_status.sh && \
        if [ \"$DB_BANK_STATUS\" = 'healthy' ]; then \
          echo 'Starting only bank_service'; \
          cd ~/soa-ecomm/bank-service && docker-compose up -d bank_service; \
        else \
          echo 'Starting all services'; \
          cd ~/soa-ecomm/bank-service && docker-compose up -d; \
        fi"
        
    - name: Check deployment status
      run: |
        sshpass -p "${{ secrets.MACHINE_PASSWORD }}" ssh ${{ secrets.MACHINE_USERNAME }}@${{ secrets.DEPLOYMENT_MACHINE_IP }} \
        "cd ~/soa-ecomm/bank-service && docker-compose ps && docker volume ls && docker network ls && echo 'System Resources:' && df -h && free -h"
